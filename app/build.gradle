plugins {
    id 'com.android.application'
}

// 签名信息从 gradle.properties / 环境变量读取，不再写死本机路径。
// 没配置时自动退回 debug 签名，保证任何人都能直接 assembleRelease。
def keystorePath = project.findProperty('SCREENOFF_KEYSTORE') ?: System.getenv('SCREENOFF_KEYSTORE')
def hasKeystore = keystorePath != null && file(keystorePath).exists()

android {
    namespace 'com.tile.screenoff'
    compileSdk 35

    defaultConfig {
        applicationId "com.tile.screenoff"
        minSdk 21
        targetSdk 35
        versionCode 23
        versionName "23"
        multiDexEnabled false
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword project.findProperty('SCREENOFF_STORE_PASSWORD') ?: System.getenv('SCREENOFF_STORE_PASSWORD')
                keyAlias project.findProperty('SCREENOFF_KEY_ALIAS') ?: System.getenv('SCREENOFF_KEY_ALIAS')
                keyPassword project.findProperty('SCREENOFF_KEY_PASSWORD') ?: System.getenv('SCREENOFF_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        aidl true
        buildConfig true
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
